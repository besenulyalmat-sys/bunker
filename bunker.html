function feedHTML(e) {
  const card = e.card ? `<span class="card-chip">${esc(e.card.label)}: ${esc(e.card.t)}</span>` : '';
  switch (e.kind) {
    case 'round': return `<p class="f round">${esc(e.text)}</p>`;
    case 'sys': return `<p class="f sys">${esc(e.text)}</p>`;
    case 'out': return `<p class="f out">${esc(e.text)}</p>`;
    case 'reveal': return `<p class="f"><b>${esc(e.who)}</b> открывает ${card}</p>`;
    case 'bot': return `<p class="f"><b>${esc(e.who)}</b> ${card} <span class="said">«${esc(e.text)}»</span></p>`;
    case 'talk': return `<p class="f talk"><b>${esc(e.who)}:</b> «${esc(e.text)}»</p>`;
    case 'event': return `<p class="f event"><b>${esc(e.who)}</b> ${esc(e.text)}</p>`;
    case 'news': return `<div class="f news"><p class="nw-k">Событие</p><p>${esc(e.text)}</p><p class="nw-n">${esc(e.note)}</p></div>`;
    case 'votes': return `<div class="f votes"><p>Голоса:</p><ul>${e.list.map(v => `<li>${esc(v.from)} → ${esc(v.to)}${v.w > 1 ? ' (×2)' : ''}</li>`).join('')}</ul></div>`;
    default: return '';
  }
}
function appendFeed(e) {
  const feed = $('#feed');
  if (!feed) return;
  feed.insertAdjacentHTML('beforeend', feedHTML(e));
  feed.scrollTop = feed.scrollHeight;
}
function waitBody(g, kind) {
  const humans = g.players.filter(p => p.human && !p.out).length;
  if (kind === 'talk') {
    return humans > 1 ? '<h3>Обсуждение</h3><p>Боты высказались. Теперь ваша очередь: спорьте вслух, защищайтесь, обвиняйте.</p>'
      : humans === 1 ? '<h3>Обсуждение</h3><p>Боты высказались. Подумай, кого не пустить, и переходи к голосованию.</p>'
        : '<h3>Обсуждение</h3><p>Боты высказались.</p>';
  }
  let body = tallyHTML(g);
  if (kind === 'revote') body = '<h3>Ничья</h3><p>Голосуют ещё раз, только между лидерами.</p>' + body;
  if (kind === 'end') body = '<h3>Бункер заполнен</h3><p>Гермодверь закрывается. Все личные дела рассекречены.</p>' + body;
  return body;
}

const UI = {
  table(g) {
    $('#screen').innerHTML = tableSkeleton(g, false);
    window.scrollTo(0, 0);
    const q = $('#quitBtn');
    q.addEventListener('click', () => {
      if (q.dataset.sure) {
        CUR = null; closeOverlay();
        if (g.net) NET.backToLobby(); else renderSetup();
        window.scrollTo(0, 0);
        return;
      }
      q.dataset.sure = '1'; q.textContent = 'Точно? Эта партия закончится';
      setTimeout(() => { if (q.isConnected) { delete q.dataset.sure; q.textContent = g.net ? 'Вернуться в комнату' : 'Выйти в меню'; } }, 3500);
    });
    g.log.forEach(appendFeed);
    UI.update(g);
  },

  update(g) {
    if (!$('#dossiers') || CUR !== g) return;
    paintTable(g);
    if (!g.waiting) {
      let html = '';
      const waits = [...g.remoteWait.values()];
      if (waits.length) {
        const names = waits.map(a => esc(a.p.name)).join(', ');
        html = `<p class="turn">${waits[0].kind === 'vote' ? 'Голосуют' : 'Выбирает карты'}: <b>${names}</b>…</p>
          <button type="button" class="btn ghost small" id="fillBtn">Не ждать: сходить за ${waits.length > 1 ? 'них' : 'игрока'} ботом</button>`;
      } else if (g.phase === 'reveal' && g.current != null) {
        const p = g.players[g.current];
        html = p.human ? `<p class="turn">Ход: <b>${esc(p.name)}</b>. Выбирает, что открыть.</p>` : `<p class="turn">Ход: <b>${esc(p.name)}</b> думает…</p>`;
      } else if (g.phase === 'talk') html = '<p class="turn">Боты высказываются…</p>';
      else if (g.phase === 'vote' || g.phase === 'revote') html = '<p class="turn">Идёт голосование…</p>';
      $('#panel').innerHTML = html;
      const fb = $('#fillBtn');
      if (fb) fb.addEventListener('click', () => NET.fillAll());
    }
    NET.hostSync(g);
  },

  onLog(g, e) {
    NET.hostLog(g, e);
    if (CUR !== g) return;
    appendFeed(e);
  },

  wait(g, kind, label) {
    return new Promise(resolve => {
      if (CUR !== g) return;
      g.waiting = true;
      g.waitKind = kind; g.waitLabel = label;
      $('#panel').innerHTML = `${waitBody(g, kind)}<button type="button" class="btn" id="waitBtn">${label}</button>`;
      const b = $('#waitBtn');
      b.focus({ preventScroll: true });
      b.addEventListener('click', () => { g.waiting = false; g.waitKind = null; resolve(); }, { once: true });
      NET.hostSync(g);
    });
  },

  pass(g, p, purpose) {
    return new Promise(resolve => {
      openOverlay(`
        <div class="pass">
          <p>Передай устройство</p>
          <h2>${esc(p.name)}</h2>
          <p>чтобы ${purpose}. Остальные, не подглядывайте.</p>
          <button type="button" class="btn big" id="passBtn">Я ${esc(p.name)}, продолжить</button>
        </div>`);
      $('#passBtn').addEventListener('click', () => resolve(), { once: true });
    });
  },

  reveal(g, p, k, opts = {}) {
    const act = opts.act || (target => { applyAction(g, p, target); return Promise.resolve({ g, p }); });
    return new Promise(resolve => {
      let busy = false;
      const doAct = target => {
        if (busy) return;
        busy = true;
        act(target).then(r => { g = r.g; p = r.p; busy = false; picking = false; draw(); });
      };
      let sel = new Set();
      let picking = false;
      const draw = () => {
        const hidden = hiddenCats(g, p);
        const need = Math.min(k, hidden.length);
        const forced = g.round === 1 && hidden.includes('prof');
        sel = new Set([...sel].filter(c => hidden.includes(c)));
        if (forced) sel.add('prof');
        const rows = g.cats.map(c => {
          const open = p.revealed.has(c);
          const on = sel.has(c);
          const lock = open || (forced && c === 'prof');
          return `<button type="button" class="pick${open ? ' is-open' : ''}${on ? ' on' : ''}" data-c="${c}" ${open ? 'disabled' : ''} aria-pressed="${on}">
            <span class="pk-l">${CATLABEL[c]}</span>
            <span class="pk-v">${esc(p.cards[c].t)}</span>
            <span class="pk-s">${open ? 'уже открыта' : lock ? 'откроется обязательно' : on ? 'откроется' : 'скрыта'}</span>
          </button>`;
        }).join('');
        let actHTML;
        if (p.action.used) actHTML = `<p class="muted">Карта действия сыграна: «${esc(p.action.name)}».</p>`;
        else if (picking) {
          const others = aliveOf(g).filter(o => o.id !== p.id);
          actHTML = `<p><b>${esc(p.action.name)}:</b> на кого?</p>
            <div class="targets">${others.map(o => `<button type="button" class="btn ghost" data-t="${o.id}">${esc(o.name)}</button>`).join('')}</div>
            <button type="button" class="btn ghost small" id="cancelAct">Не сейчас</button>`;
        } else {
          actHTML = `<p><b>${esc(p.action.name)}.</b> ${esc(p.action.desc)}</p>
            <button type="button" class="btn ghost" id="useAct">Сыграть сейчас</button>`;
        }
        openOverlay(`
          <div class="private">
            <h2>${esc(p.name)}, твой ход</h2>
            <p class="muted">${g.round === 1 ? 'Профессию открывают все. Выбери ещё одну карту.' : `Выбери, что открыть: ${need} ${plural(need, 'карту', 'карты', 'карт')}.`} Сейчас важнее всего: ${[...g.ni.needs].map(needName).join(', ')}.</p>
            <div class="picks">${rows}</div>
            <div class="action-box"><h3>Карта действия</h3>${actHTML}</div>
            <p class="count">Выбрано: ${sel.size} из ${need}</p>
            <button type="button" class="btn big" id="doReveal" ${sel.size === need ? '' : 'disabled'}>${need ? 'Открыть выбранное' : 'Все карты уже открыты, дальше'}</button>
          </div>`);
        $$('.pick[data-c]').forEach(b => b.addEventListener('click', () => {
          const c = b.dataset.c;
          if (forced && c === 'prof') return;
          if (sel.has(c)) sel.delete(c);
          else {
            if (sel.size >= need) {
              const drop = [...sel].find(x => !(forced && x === 'prof'));
              if (drop) sel.delete(drop); else return;
            }
            sel.add(c);
          }
          draw();
        }));
        const use = $('#useAct');
        if (use) use.addEventListener('click', () => {
          if (p.action.target === 'other') { picking = true; draw(); }
          else doAct(null);
        });
        const cancel = $('#cancelAct');
        if (cancel) cancel.addEventListener('click', () => { picking = false; draw(); });
        $$('[data-t]').forEach(b => b.addEventListener('click', () => doAct(+b.dataset.t)));
        $('#doReveal').addEventListener('click', () => { closeOverlay(); resolve([...sel]); }, { once: true });
      };
      draw();
    });
  },

  vote(g, p, opts, isRevote) {
    return new Promise(resolve => {
      let chosen = null;
      const draw = () => {
        const list = opts.map(o => {
          const op = g.cats.filter(c => o.revealed.has(c));
          const shown = op.slice(0, 4).map(c => esc(o.cards[c].t)).join('; ') + (op.length > 4 ? `; ещё ${op.length - 4}` : '');
          return `<button type="button" class="cand${chosen === o.id ? ' on' : ''}" data-v="${o.id}" aria-pressed="${chosen === o.id}">
            <span class="cn">${esc(o.name)}</span>
            <span class="cd">${shown || 'Пока ничего не открыто'}</span>
          </button>`;
        }).join('');
        openOverlay(`
          <div class="private">
            <h2>${esc(p.name)}, кого не пускаем?</h2>
            ${isRevote ? '<p class="muted">Переголосование: выбирать можно только между лидерами.</p>' : ''}
            ${p.double ? '<p class="muted">Твой голос в этом раунде считается за два.</p>' : ''}
            <div class="cands">${list}</div>
            <button type="button" class="btn big danger" id="doVote" ${chosen == null ? 'disabled' : ''}>${chosen == null ? 'Выбери, против кого голосуешь' : `Голосовать против: ${esc(g.players[chosen].name)}`}</button>
          </div>`);
        $$('.cand').forEach(b => b.addEventListener('click', () => { chosen = +b.dataset.v; draw(); }));
        $('#doVote').addEventListener('click', () => { if (chosen == null) return; closeOverlay(); resolve(chosen); }, { once: true });
      };
      draw();
    });
  },

  final(g, out, opts = {}) {
    closeOverlay();
    if (!opts.guest) NET.hostFinal(g, out);
    const S = aliveOf(g), O = g.players.filter(p => p.out).sort((a, b) => a.outRound - b.outRound);
    $('#screen').innerHTML = `
    <section class="final">
      <div class="verdict ${out.level}">
        <h2>${out.title}</h2>
        <p class="sub">${esc(g.cat.name)}, ${fmtMonths(effDur(g))} под землёй</p>
        <p>${esc(out.text)}</p>
      </div>
      <div class="secret-card open big">
        <p class="doc-kind">Секретная карта катастрофы${out.twist.early ? ' (открыта по ходу игры)' : ''}</p>
        <p class="tw">${esc(out.twist.t)}</p>
        ${out.twist.notes.length ? `<p class="muted">${out.twist.notes.map(esc).join(' ')}</p>` : ''}
      </div>
      <div class="report">
        ${out.parts.map(r => `<div class="rep ${r.tone}"><h4>${r.title}<span class="mark">${r.mark}</span></h4><p>${esc(r.text)}</p></div>`).join('')}
        ${g.eventLog.length ? `<p class="exiled">События в бункере: ${g.eventLog.map(e => esc(e.t.replace(/\.$/, ''))).join('; ')}.</p>` : ''}
        <p class="exiled">Остались снаружи: ${O.map(p => esc(p.name)).join(', ')}. Их судьба неизвестна. Говорят, кто-то из них нашёл другой бункер.</p>
      </div>
      <h3 class="sec">Вошли в бункер</h3>
      <div class="dossiers wide">${S.map(p => dossierHTML(g, p, { full: true, stamp: 'pass' })).join('')}</div>
      <h3 class="sec">Остались за дверью</h3>
      <div class="dossiers wide">${O.map(p => dossierHTML(g, p, { full: true })).join('')}</div>
      <div class="row-actions end">
        <button type="button" class="btn big" id="againBtn">Сыграть ещё раз с теми же игроками</button>
        <button type="button" class="btn ghost" id="menuBtn">Изменить игроков</button>
      </div>
    </section>`;
    window.scrollTo(0, 0);
    if (opts.guest) {
      $('.row-actions.end').innerHTML = `<p class="muted">Ждём, когда ${esc(g.hostName)} начнёт новую партию.</p><button type="button" class="btn ghost" id="leaveBtn">Выйти из комнаты</button>`;
      $('#leaveBtn').addEventListener('click', guestLeave);
      return;
    }
    if (g.net) {
      $('#againBtn').addEventListener('click', () => NET.startGame());
      $('#menuBtn').textContent = 'Вернуться в комнату';
      $('#menuBtn').addEventListener('click', () => NET.backToLobby());
      return;
    }
    $('#againBtn').addEventListener('click', () => showBrief(newGame(setup)));
    $('#menuBtn').addEventListener('click', () => { CUR = null; renderSetup(); window.scrollTo(0, 0); });
  }
};

function tallyHTML(g) {
  if (!g.tally) return '';
  const max = Math.max(1, ...g.tally.map(t => t.n));
  return `<div class="tally">${g.tally.map(t => {
    const p = g.players[t.id];
    return `<div class="t-row${p.out ? ' gone' : ''}"><span class="t-n">${esc(p.name)}</span><span class="t-bar"><i style="width:${(t.n / max) * 100}%"></i></span><span class="t-c">${t.n}</span></div>`;
  }).join('')}</div>`;
}

function openOverlay(html) {
  const o = $('#overlay');
  const wasOpen = !o.hidden;
  const a = document.activeElement;
  const key = a && o.contains(a) ? ['id', 'data-c', 'data-v', 'data-t'].map(k => a.getAttribute(k) && `[${k}="${a.getAttribute(k)}"]`).find(Boolean) : null;
  const top = o.scrollTop;
  o.innerHTML = `<div class="ov-inner">${html}</div>`;
  o.hidden = false;
  document.body.classList.add('locked');
  if (wasOpen) o.scrollTop = top; else o.scrollTop = 0;
  const f = (key && o.querySelector(key)) || o.querySelector('button:not([disabled])');
  if (f) f.focus({ preventScroll: true });
}
function closeOverlay() {
  const o = $('#overlay');
  if (!o) return;
  o.hidden = true;
  o.innerHTML = '';
  document.body.classList.remove('locked');
}

function boot() {
  const m = location.hash.match(/room=([A-Za-z0-9]+)/);
  if (m) renderGuestJoin(m[1].toUpperCase()); else renderSetup();
}

function renderGuestJoin(code, err) {
  closeOverlay();
  $('#screen').innerHTML = `
  <section class="lobby">
    <div class="hero small">
      <h1 class="title">Бункер</h1>
      <div class="hazard" aria-hidden="true"></div>
      <p class="lead">Тебя позвали в комнату ${esc(code)}.</p>
    </div>
    <div class="panel narrow">
      <label class="field"><span>Как тебя зовут</span><input type="text" id="guestName" maxlength="16" value="${esc(lsGet('bunker-name'))}" placeholder="Имя"></label>
      <button type="button" class="btn big" id="joinBtn">Войти в комнату</button>
      <p class="hint" id="joinErr" role="alert">${err ? esc(err) : ''}</p>
      <button type="button" class="btn ghost small" id="ownGame">Нет, хочу свою игру</button>
    </div>
  </section>`;
  const go = async () => {
    const name = cleanName($('#guestName').value);
    if (!name) { $('#joinErr').textContent = 'Введи имя, чтобы остальные знали, кто ты.'; $('#guestName').focus(); return; }
    lsSet('bunker-name', name);
    const b = $('#joinBtn');
    b.disabled = true; b.textContent = 'Подключаюсь…';
    try {
      await NET.join(code, name);
      if (!NET.view) renderGuestLobby();
    } catch (e) {
      NET.reset();
      const msg = e && e.message === 'full' ? 'В комнате уже 12 человек.'
        : e && e.message === 'peer-load' ? 'Не удалось загрузить модуль связи. Проверь интернет.'
          : e && (e.type === 'peer-unavailable' || e.message === 'timeout') ? 'Комната не отвечает. Возможно, хозяин закрыл вкладку или ссылка устарела.'
            : 'Не получилось подключиться. Попробуй ещё раз.';
      renderGuestJoin(code, msg);
    }
  };
  $('#joinBtn').addEventListener('click', go);
  $('#guestName').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#ownGame').addEventListener('click', () => { history.replaceState(null, '', location.href.split('#')[0]); renderSetup(); });
}

        <li class="lrow"><span class="ln">${esc(p.name)}</span><span class="lk ${p.kind === 'guest' ? 'net' : ''}">${kindOf(p)}</span></li>`).join('')}
      </ol>
      <p class="count">Набор карт: ${L.mode === 'big' ? 'большой, 11 карт' : 'обычный, 8 карт'}. Катастрофа: ${esc(L.cat || 'случайная')}.</p>
      <p class="muted">${NET.spectator ? 'Партия уже идёт. Ты смотришь как зритель и сможешь сыграть в следующей.' : 'Ждём, когда хозяин начнёт игру.'}</p>
      <button type="button" class="btn ghost small" id="leaveBtn">Выйти из комнаты</button>
    </div>
  </section>`;
  $('#leaveBtn').addEventListener('click', guestLeave);
}

boot();
</script>
</body>
</html>
