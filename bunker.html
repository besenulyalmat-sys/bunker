<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бункер</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #C8C9BD;
  --panel: #DCDDD2;
  --line: #A2A395;
  --text: #23251E;
  --muted: #55574B;
  --paper: #F2EAD2;
  --paper-edge: #D3C7A6;
  --ink: #2A2620;
  --ink-soft: #6A6253;
  --stamp: #A3241C;
  --pass: #2E5B33;
  --hazard: #D29A14;
  --hazard-dark: #23251E;
  --btn-bg: #39432D;
  --btn-text: #F2EAD2;
  --danger: #A3241C;
  --danger-text: #FBF5E6;
  --focus: #C27A00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2C3029; --panel: #383D34; --line: #545B4D; --text: #E6E2D3; --muted: #A9A796;
    --paper: #E3DABF; --paper-edge: #B8AC8C; --ink: #2A2620; --ink-soft: #675F50;
    --stamp: #B02A20; --pass: #2E5B33; --hazard: #DDA62A; --hazard-dark: #22251F;
    --btn-bg: #DDA62A; --btn-text: #22251F; --danger: #C4382C; --danger-text: #FBF5E6; --focus: #F2C25A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2C3029; --panel: #383D34; --line: #545B4D; --text: #E6E2D3; --muted: #A9A796;
  --paper: #E3DABF; --paper-edge: #B8AC8C; --ink: #2A2620; --ink-soft: #675F50;
  --stamp: #B02A20; --pass: #2E5B33; --hazard: #DDA62A; --hazard-dark: #22251F;
  --btn-bg: #DDA62A; --btn-text: #22251F; --danger: #C4382C; --danger-text: #FBF5E6; --focus: #F2C25A;
  color-scheme: dark;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 'PT Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
body.locked { overflow: hidden; }
h1, h2, h3, h4 { font-family: 'Russo One', 'Arial Black', Impact, sans-serif; font-weight: 400; line-height: 1.15; margin: 0 0 .5em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .75em; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px 16px 48px; }
.muted { color: var(--muted); }
.private .muted { color: var(--muted); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* кнопки */
.btn {
  font: 700 1rem/1.2 'PT Sans', Arial, sans-serif; min-height: 44px; padding: 11px 18px;
  border: 0; border-radius: 6px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer;
}
.btn:hover:not([disabled]) { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.big { width: 100%; font-size: 1.1rem; padding: 14px 18px; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
.btn.small { min-height: 38px; padding: 8px 12px; font-size: .9rem; }
.btn.danger { background: var(--danger); color: var(--danger-text); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.row-actions.end { margin-top: 28px; }
.row-actions.end .btn.big { width: auto; flex: 1 1 280px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.center { text-align: center; }

/* полоса «осторожно» */
.hazard {
  height: 14px; border-radius: 2px;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, var(--hazard-dark) 14px 28px);
}
.hazard.thin { height: 8px; border-radius: 6px 6px 0 0; }

/* стартовый экран */
.hero { padding: 28px 0 20px; max-width: 760px; }
.title {
  font-size: clamp(4rem, 17vw, 9.5rem); letter-spacing: -0.02em; margin: 0 0 12px;
  line-height: .9; color: var(--text);
}
.hero .hazard { max-width: 520px; margin-bottom: 18px; }
.lead { font-size: 1.15rem; max-width: 34em; }
.setup { max-width: 760px; }
.rules { max-width: 760px; }
.rules summary, .mini-brief summary { cursor: pointer; font-weight: 700; }
.rules p { margin-top: .6em; max-width: 60ch; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.prow input {
  font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 6px; width: 100%; min-width: 0;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
}
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: .9rem; min-height: 41px; padding: 6px 10px; border: 0; background: transparent; color: var(--text); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); }
.x { font-size: 1.4rem; width: 44px; height: 44px; border-radius: 6px; border: 1.5px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
.x[disabled] { opacity: .3; cursor: not-allowed; }
.count { color: var(--muted); }
.hint { font-size: .95rem; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 8px 0 16px; font-weight: 700; }
.field select { width: 100%; max-width: 100%; min-width: 0; font: inherit; font-weight: 400; min-height: 44px; padding: 8px 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); }
@media (max-width: 340px) {
  .prow { grid-template-columns: 1fr auto; }
  .prow input { grid-column: 1 / -1; }
}

/* документы брифинга */
.brief-screen { max-width: 900px; margin: 0 auto; padding-top: 12px; }
.docs { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 18px; }
.doc { background: var(--paper); color: var(--ink); padding: 20px 20px 14px; border-radius: 3px; box-shadow: 0 1px 0 var(--paper-edge), 0 10px 24px -16px rgba(0,0,0,.55); }
.doc h2 { font-size: 1.6rem; }
.doc-kind { color: var(--ink-soft); font-size: .9rem; margin-bottom: 4px; }
.docs.compact { margin: 12px 0 4px; grid-template-columns: 1fr; gap: 10px; }
.docs.compact .doc { padding: 12px 14px 6px; font-size: .92rem; }
.docs.compact .doc h2 { font-size: 1.1rem; }

/* игровой стол */
.table { display: grid; gap: 18px; padding-top: 8px; }
@media (min-width: 900px) {
  .table { grid-template-columns: minmax(320px, 380px) 1fr; align-items: start; }
  .side { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .side > * { flex-shrink: 0; }
  .side .feed { flex: 1 1 auto; max-height: none; min-height: 160px; }
}
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.status { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 4px; }
.chip-s { font-size: .9rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: 20px; }
.mini-brief { padding: 8px 14px 12px; }
.turn { margin: 0; }
.panel h3 { margin-bottom: .35em; }
.panel .btn { width: 100%; margin-top: 6px; }
.side > .btn { margin-top: 10px; align-self: flex-start; }

/* журнал */
.feed {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; max-height: 300px; overflow-y: auto; font-size: .95rem;
}
.f { margin: 0 0 8px; }
.f.round { font-family: 'Russo One', 'Arial Black', sans-serif; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.f.round:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.f.sys { color: var(--muted); font-style: italic; }
.f.out { color: var(--stamp); font-weight: 700; }
.f.event { border-left: 3px solid var(--hazard); padding-left: 8px; }
.f.talk { padding-left: 11px; }
.card-chip { display: inline-block; background: var(--paper); color: var(--ink); border-radius: 3px; padding: 0 6px; font-family: 'PT Mono', 'Courier New', monospace; font-size: .85rem; }
.said { color: var(--muted); }
.votes ul { margin: 2px 0 0; padding-left: 18px; columns: 2; column-gap: 16px; }
.votes p { margin: 0; font-weight: 700; }

/* итог голосования */
.tally { display: grid; gap: 6px; margin: 4px 0 8px; }
.t-row { display: grid; grid-template-columns: minmax(70px, 30%) 1fr 22px; gap: 8px; align-items: center; font-size: .92rem; }
.t-row.gone .t-n { color: var(--stamp); font-weight: 700; text-decoration: line-through; }
.t-bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.t-bar i { display: block; height: 100%; background: var(--stamp); }
.t-c { text-align: right; font-weight: 700; }

/* личные дела */
.dossiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 22px 14px; padding-top: 12px; }
.dossiers.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.dossier {
  position: relative; background: var(--paper); color: var(--ink);
  border-radius: 2px 6px 6px 6px; padding: 14px 12px 10px;
  box-shadow: 0 1px 0 var(--paper-edge), 0 10px 22px -16px rgba(0,0,0,.6);
}
.dossier .tab {
  position: absolute; top: -11px; left: 0; background: var(--paper); color: var(--ink-soft);
  font: .75rem/1 'PT Mono', 'Courier New', monospace; padding: 5px 10px 4px; border-radius: 5px 5px 0 0;
}
.dossier header { display: flex; flex-direction: column; margin-bottom: 8px; border-bottom: 1.5px solid var(--paper-edge); padding-bottom: 6px; }
.dossier h3 { font-size: 1.1rem; margin: 0; overflow-wrap: anywhere; }
.dossier .who { font-size: .8rem; color: var(--ink-soft); }
.dossier dl { margin: 0; display: grid; gap: 5px; }
.dossier .row { display: grid; gap: 0; }
.dossier dt { font-size: .74rem; color: var(--ink-soft); }
.dossier dd { margin: 0; font: .86rem/1.3 'PT Mono', 'Courier New', monospace; overflow-wrap: anywhere; }
.dossier .row.prof dd { font-weight: 700; }
.redact { display: inline-block; height: .95em; vertical-align: middle; background: var(--ink); border-radius: 1px; }
.row.secret dd { color: var(--ink-soft); }
.only { display: block; font: .68rem 'PT Sans', Arial, sans-serif; color: var(--ink-soft); font-style: italic; }
.dossier footer { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--paper-edge); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.act { font-size: .74rem; color: var(--ink-soft); width: 100%; }
.badge { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--ink); color: var(--paper); }
.dossier.current { box-shadow: 0 0 0 3px var(--hazard), 0 10px 22px -16px rgba(0,0,0,.6); }
.dossier.out > :not(.stamp) { opacity: .5; }

/* штамп — главный акцент */
.stamp {
  position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg);
  font: 1.35rem/1 'Russo One', 'Arial Black', sans-serif; text-transform: uppercase; letter-spacing: .04em;
  color: var(--stamp); border: 3px solid var(--stamp); border-radius: 6px; padding: 6px 12px 5px;
  opacity: .9; pointer-events: none; white-space: nowrap;
  background: color-mix(in srgb, var(--paper) 55%, transparent);
}
.stamp.ok { color: var(--pass); border-color: var(--pass); }
.dossier.passed { opacity: 1; }
.just-out .stamp { animation: stampIn .42s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampIn {
  0% { transform: translate(-50%, -50%) rotate(-24deg) scale(2.4); opacity: 0; }
  100% { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: .9; }
}

/* приватные экраны */
#overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
}
#overlay[hidden] { display: none; }
.ov-inner { max-width: 620px; margin: 0 auto; }
.pass { text-align: center; padding-top: 14vh; }
.pass h2 { font-size: clamp(2.4rem, 11vw, 4rem); margin: 6px 0 12px; overflow-wrap: anywhere; }
.pass .btn { margin-top: 18px; }
.private h2 { font-size: 1.6rem; margin-top: 8px; }
.picks { display: grid; gap: 8px; margin: 12px 0 16px; }
.pick {
  text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center;
  background: var(--paper); color: var(--ink); border: 2px solid transparent; border-radius: 6px;
  padding: 10px 12px; cursor: pointer; font: inherit; min-height: 52px;
}
.pick .pk-l { font-size: .78rem; color: var(--ink-soft); grid-column: 1; }
.pick .pk-v { font-family: 'PT Mono', 'Courier New', monospace; grid-column: 1; }
.pick .pk-s { grid-column: 2; grid-row: 1 / span 2; font-size: .8rem; color: var(--ink-soft); text-align: right; }
.pick.on { border-color: var(--stamp); }
.pick.on .pk-s { color: var(--stamp); font-weight: 700; }
.pick.is-open { opacity: .55; cursor: default; }
.action-box { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
.action-box p { margin-bottom: 8px; }
.targets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.cands { display: grid; gap: 8px; margin: 12px 0 16px; }
.cand {
  text-align: left; display: grid; gap: 2px; background: var(--paper); color: var(--ink);
  border: 2px solid transparent; border-radius: 6px; padding: 10px 12px; cursor: pointer; font: inherit;
}
.cand .cn { font-family: 'Russo One', 'Arial Black', sans-serif; font-size: 1.05rem; }
.cand .cd { font-size: .85rem; color: var(--ink-soft); }
.cand.on { border-color: var(--stamp); }

/* финал */
.final { max-width: 1000px; margin: 0 auto; padding-top: 16px; }
.verdict { background: var(--paper); color: var(--ink); padding: 26px 22px 18px; border-radius: 3px; margin-bottom: 18px; border-top: 10px solid var(--pass); }
.verdict.mid { border-top-color: var(--hazard); }
.verdict.lose { border-top-color: var(--stamp); }
.verdict h2 { font-size: clamp(2.2rem, 8vw, 3.6rem); margin-bottom: 4px; }
.verdict .sub { color: var(--ink-soft); }
.report { display: grid; gap: 10px; margin-bottom: 26px; }
.rep { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--pass); border-radius: 6px; padding: 10px 14px; }
.rep.mid { border-left-color: var(--hazard); }
.rep.bad { border-left-color: var(--stamp); }
.rep h4 { font-size: 1rem; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 10px; }
.rep .mark { font: 700 .85rem 'PT Sans', Arial, sans-serif; color: var(--muted); }
.rep p { margin: 0; max-width: 70ch; }
.exiled { color: var(--muted); font-style: italic; margin-top: 6px; }
.sec { margin: 22px 0 4px; }

@media (prefers-reduced-motion: reduce) {
  .just-out .stamp { animation: none; }
}

/* секретная карта катастрофы */
.secret-card {
  margin-top: 12px; border: 2px dashed var(--ink-soft); border-radius: 4px; padding: 10px 12px;
  background: repeating-linear-gradient(45deg, transparent 0 8px, rgba(0, 0, 0, .04) 8px 16px);
}
.secret-card p { margin: 0 0 4px; }
.secret-card.open { border-style: solid; border-color: var(--stamp); background: none; }
.secret-card.big { background: var(--paper); color: var(--ink); margin: 0 0 18px; padding: 16px 18px; border-width: 3px; }
.secret-card.big .tw { font-family: 'Russo One', 'Arial Black', sans-serif; font-size: 1.3rem; line-height: 1.25; margin: 4px 0 8px; }
.secret-card.big .muted { color: var(--ink-soft); }
.doc ul { margin: 0 0 .75em; padding-left: 18px; }

/* события */
.f.news { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 8px 10px; border-left: 5px solid var(--hazard); }
.f.news p { margin: 0; }
.nw-k { font-size: .78rem; color: var(--ink-soft); }
.nw-n { font-size: .85rem; color: var(--ink-soft); }

.seg.wide { display: flex; }
.seg.wide button { flex: 1 1 0; }
.field small { font-weight: 400; }

/* комната */
.online { border-width: 2px; }
.hero.small { padding: 18px 0 14px; }
.hero.small .title { font-size: clamp(2.6rem, 11vw, 5rem); }
.panel.narrow, .lobby { max-width: 760px; }
.panel.narrow { margin-left: auto; margin-right: auto; }
.lobby .panel.narrow { margin-left: 0; }
.linkbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 10px; }
.linkbox input, .field input {
  font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 6px; width: 100%; min-width: 0;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
}
.linkbox input { font-family: 'PT Mono', 'Courier New', monospace; font-size: .9rem; }
.field input { font-weight: 400; }
.lobby-list { margin-bottom: 8px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 44px; padding: 0 0 0 12px; border: 1.5px solid var(--line); border-radius: 6px; }
.lrow .ln { font-weight: 700; overflow-wrap: anywhere; }
.lrow .lk { font-size: .85rem; color: var(--muted); padding-right: 10px; }
.lrow .lk.net { color: var(--text); }
.lrow .x { border: 0; border-left: 1.5px solid var(--line); border-radius: 0 6px 6px 0; }
.lobby .btn.ghost.small { margin-top: 10px; }

</style>
</head>
<body>
<div class="wrap"><main id="screen"></main></div>
<div id="overlay" hidden role="dialog" aria-modal="true"></div>
<script>
'use strict';
/* ================= КАТАСТРОФЫ ================= */
const CAT_GROUPS = [
  { name: 'Природные катастрофы', needs: ['food', 'energy', 'build'], dur: [24, 72] },
  { name: 'Войны и техногенные катастрофы', needs: ['defense', 'med', 'tech'], dur: [24, 60] },
  { name: 'Эпидемии и мутации', needs: ['med', 'science'], dur: [12, 36] },
  { name: 'Зомби, мутанты и существа', needs: ['defense', 'scout', 'med'], dur: [18, 48] },
  { name: 'Космос и фантастика', needs: ['science', 'energy', 'radio'], dur: [24, 72] },
  { name: 'Психологические и социальные', needs: ['psy', 'science'], dur: [12, 36] },
  { name: 'Поломка инфраструктуры', needs: ['tech', 'energy', 'food'], dur: [12, 36] },
  { name: 'Мистика', needs: ['psy', 'scout', 'science'], dur: [12, 48] },
  { name: 'Необычные правила выживания', needs: ['tech', 'science', 'food'], dur: [24, 60] },
  { name: 'Абсурдные сценарии', needs: ['psy', 'science', 'scout'], dur: [12, 36] }
];

const RAW_CATS = `
## 0
Падение астероида = Астероид уничтожил большую часть цивилизации. Выжившие столкнулись с многолетней зимой.
Супервулкан = Извержение вулкана выбросило в атмосферу огромное количество пепла. Солнце почти не видно.
Солнечная супервспышка = Мощный выброс солнечной энергии вывел из строя большую часть электроники.
Смещение земной оси = Климатические зоны резко изменились, привычные экосистемы разрушены.
Глобальное землетрясение = Цепочка мощнейших землетрясений разрушила города и инфраструктуру.
Всемирное наводнение = Уровень океана поднялся настолько, что большая часть суши оказалась под водой.
Великая засуха = Дожди перестали идти на большей части планеты.
Ледниковый период = Температура резко упала, и Земля начала замерзать.
Необратимое глобальное потепление = Температура стала смертельно высокой во многих регионах.
Гигантские цунами = Береговые города уничтожены серией волн невероятной высоты.
Супершторм = Планету охватили многомесячные ураганы.
Разрушение озонового слоя = Солнечное излучение сделало пребывание на поверхности крайне опасным.

function parseMeta(s) {
  const flags = [];
  let v = null, tags = null;
  s = s.replace(/\s\^([\w:.*=-]+)/g, (_, f) => { flags.push(f); return ''; });
  s = s.replace(/\s!(-?\d+)/, (_, n) => { v = +n; return ''; });
  s = s.replace(/\s@([a-z ]+)$/, (_, t) => { tags = t.trim().split(/\s+/); return ''; });
  return { text: s.trim(), flags, v, tags };
}
function parseDeck(raw, stripDot = true) {
  const out = [];
  let def = { tags: [], v: 0, flags: [] };
  for (let line of raw.split('\n')) {
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('##')) {
      const m = parseMeta(' ' + line.slice(2));
      def = { tags: m.tags && m.tags[0] !== 'none' ? m.tags : [], v: m.v ?? 0, flags: m.flags };
      continue;
    }
    const m = parseMeta(line);
    let text = m.text;
    if (stripDot) text = text.replace(/\.$/, '');
    const tags = m.tags ? (m.tags[0] === 'none' ? [] : m.tags) : def.tags.slice();
    const flags = m.flags.length ? (m.flags.includes('none') ? [] : m.flags) : def.flags.slice();
    out.push({ raw: text, v: m.v ?? def.v, tags, flags });
  }
  return out;
}
function parseCats(raw) {
  const out = [];
  let gi = 0;
  for (let line of raw.split('\n')) {
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('##')) { gi = +line.slice(2).trim(); continue; }
    const [name, text] = line.split(' = ');

    out.push({ id: 'c' + out.length, name, text, group: gi, needs: needs.slice(0, 4), dur: CAT_GROUPS[gi].dur });
  }
  return out;
}

}

function makeProf(decks) {
  const b = drawCard(decks, 'prof');
  const st = pick(STAGES);
  return { raw: `${b.raw}, ${st[0]}`, base: b.raw, v: 0, tags: b.tags, flags: [], mul: st[1] };
}
function renderCard(card, p) { card.t = gform(card.raw, p.gender); }

function newGame(st) {
  const mode = st.mode === 'big' ? 'big' : 'classic';
  const cats = mode === 'big' ? CATS_BIG : CATS_CLASSIC;
  const cat = (st.cat !== 'random' && CATASTROPHES.find(c => c.id === st.cat)) || pick(CATASTROPHES);
  const n = st.players.length;
  const capacity = Math.floor(n / 2);
  const steps = Math.floor((cat.dur[1] - cat.dur[0]) / 6);
  const dur = cat.dur[0] + 6 * Math.floor(rnd() * (steps + 1));

  const bunker = {
    area: 40 + 10 * Math.floor(rnd() * 23),
    supply: 6 * (1 + Math.floor(rnd() * 8)),
    rooms: shuffle(ROOMS).slice(0, 3),
    states: shuffle(STATES).slice(0, 2),
    stash: 0
  };
  const extraNeeds = new Set(), extraCover = new Set();
  for (const s of bunker.states) for (const f of s.flags.map(fx)) {
    if (f.k === 'n') extraNeeds.add(f.a);
    if (f.k === 'c') extraCover.add(f.a);
    if (f.k === 's') bunker.supply = Math.max(3, Math.round(bunker.supply * +f.a));
    if (f.k === 'r') bunker.rooms = bunker.rooms.filter(r => r[1] !== f.a);
  }

  const decks = {};
  for (const c of cats) if (DECKS[c]) decks[c] = shuffle(DECKS[c]);
  const actOrder = shuffle(ACTIONS);
  const persKeys = Object.keys(PERS);
  const players = st.players.map((s, i) => {
    const gender = s.human ? (rnd() < 0.5 ? 'm' : 'f') : s.gender;
    const age = 18 + Math.floor(rnd() * 63);
    const cards = {};
    for (const c of cats) {
      if (c === 'bio') cards.bio = { raw: `${gender === 'm' ? 'Мужчина' : 'Женщина'}, ${age} ${plural(age, 'год', 'года', 'лет')}`, v: age > 65 ? -1 : 0, tags: [], flags: [], mul: 1, age };
      else if (c === 'prof') cards.prof = makeProf(decks);
      else if (c === 'bond') { const b = drawCard(decks, 'bond'); b.raw = `{P}: ${b.raw}`; cards.bond = b; }
      else cards[c] = drawCard(decks, c);
    }
    return {
      id: i, name: s.name, human: s.human, remote: s.remote || null, wasRemote: false, gender, cards,
      pers: s.human ? null : pick(persKeys),
      revealed: new Set(),
      action: { ...actOrder[i % actOrder.length], used: false },
      out: false, outRound: 0, justOut: false,
      immune: false, double: false, muted: false,
      grudge: {}, rel: {}, lastVotes: 0, prevVotes: 0, intent: null
    };
  });
  // карты со ссылкой на другого игрока
  for (const p of players) {
    for (const c of cats) {
      const card = p.cards[c];
      if (card.raw.includes('{P}')) {
        const other = pick(players.filter(o => o !== p));
        card.raw = card.raw.replace('{P}', () => other.name);
        card.ref = other.id;
        if (card.flags.includes('friend')) p.rel[other.id] = 1;
        if (card.flags.includes('foe')) p.rel[other.id] = -1;
      }
      renderCard(card, p);
    }
  }
  const humans = players.filter(p => p.human);
  const g = {
    uid: Math.random().toString(36).slice(2),
    mode, cats, players, cat, dur, bunker, capacity, rounds: n - capacity, round: 0,
    twist: pick(TWISTS), twistOpen: false,
    extraNeeds, extraCover, events: shuffle(EVENTS), eventLog: [],
    log: [], decks,
    multiHuman: humans.length > 1,
    viewer: humans.length === 1 ? humans[0].id : null,
    phase: 'brief', current: null, tally: null, waiting: false, ni: null,
    net: !!st.net, remoteWait: new Map(), waitKind: null, waitLabel: ''
  };
  if (g.net) { g.multiHuman = false; g.viewer = 0; }
  refreshNeeds(g);
  return g;
}

/* ---------- потребности, срок и запасы ---------- */
function twistFx(g) { return g.twistOpen ? g.twist.flags.map(fx) : []; }
function effDur(g) {
  let d = g.dur;
  for (const f of twistFx(g)) {
    if (f.k === 'd' && f.op === '*') d = Math.round(d * +f.a / 6) * 6;
    if (f.k === 'd' && f.op === '=') d = +f.a;
  }
  return Math.max(6, d);
}
function effSupply(g) {
  let s = g.bunker.supply + g.bunker.stash;
  for (const f of twistFx(g)) if (f.k === 's') s = Math.round(s * +f.a);
  return s;
}
function refreshNeeds(g) {
  const needs = new Set(g.cat.needs);
  g.extraNeeds.forEach(t => needs.add(t));
  const covered = new Set(g.bunker.rooms.map(r => r[1]));
  g.extraCover.forEach(t => covered.add(t));
  if (g.twistOpen) {
    g.twist.tags.forEach(t => needs.add(t));
    for (const f of twistFx(g)) if (f.k === 'c') covered.add(f.a);
  }
  if (effSupply(g) >= effDur(g)) covered.add('food');
  g.ni = { needs, covered };
}

const aliveOf = g => g.players.filter(p => !p.out);
const humanReveal = (g, p, k) => (p.remote ? NET.askReveal(g, p, k) : UI.reveal(g, p, k));
const humanVote = (g, p, opts, rv) => (p.remote ? NET.askVote(g, p, opts, rv) : UI.vote(g, p, opts, rv));
const hiddenCats = (g, p) => g.cats.filter(c => !p.revealed.has(c));
function revealsThisRound(g) {
  if (g.round === 1) return 2;
  return Math.min(3, Math.ceil((g.cats.length - 2) / Math.max(1, g.rounds - 1)));
}
function addLog(g, e) { g.log.push(e); UI.onLog(g, e); }

/* ================= ОЦЕНКА ================= */
function itemScore(g, cat, it) {
  let s = it.v;
  const mul = it.mul || 1;
  for (const tag of it.tags) {
    if (g.ni.needs.has(tag)) s += (g.ni.covered.has(tag) ? 1.1 : 2) * mul;
    else if (tag === 'psy') s += 0.4 * mul;
    else s += 0.15 * mul;
  }
  if (it.flags.includes('contagious')) s -= g.cat.group === 2 ? 3 : 1;
  if (it.flags.includes('med') && !g.ni.covered.has('med')) s -= 0.5;
  return s;
}
function publicValue(g, p) {
  let s = 0;
  for (const c of g.cats) s += p.revealed.has(c) ? itemScore(g, c, p.cards[c]) : 0.2;
  return s;
}
function worstRevealed(g, p) {
  let w = null;
  for (const c of g.cats) {
    if (!p.revealed.has(c)) continue;
    const s = itemScore(g, c, p.cards[c]);
    if (!w || s < w.score) w = { cat: c, item: p.cards[c], score: s };
  }
  return w;
}
function inDanger(g, b) {
  const sorted = aliveOf(g).slice().sort((x, y) => publicValue(g, x) - publicValue(g, y));
  return sorted.indexOf(b) < 2 || b.prevVotes > 0;
}
const quote = t => lc(t).replace(/\.$/, '');

/* ================= БОТЫ ================= */
function botChooseVote(g, b, opts, useIntent) {
  const P = PERS[b.pers];
  let best = null, bestS = Infinity;
  for (const c of opts) {
    let s = publicValue(g, c) + (rnd() * 2 - 1) * P.noise - (b.grudge[c.id] || 0) * P.grudge * 0.8 + (b.rel[c.id] || 0) * 1.8;
    if (useIntent && b.intent === c.id) s -= 1.5;
    if (s < bestS) { bestS = s; best = c; }
  }
  return best.id;
}

function botPickReveal(g, b, need) {
  const res = [];
  let hidden = hiddenCats(g, b);
  if (g.round === 1 && hidden.includes('prof')) { res.push('prof'); hidden = hidden.filter(c => c !== 'prof'); }
  const noise = PERS[b.pers].noise * 0.6;
  const ranked = b.pers === 'kind'
    ? shuffle(hidden)
    : hidden.map(c => ({ c, s: itemScore(g, c, b.cards[c]) + (rnd() * 2 - 1) * noise })).sort((x, y) => y.s - x.s).map(x => x.c);
  for (const c of ranked) { if (res.length >= need) break; res.push(c); }
  return res.slice(0, need);
}

function botRevealLine(g, b, c) {
  const s = itemScore(g, c, b.cards[c]);
  const tone = s >= 1.5 ? 'good' : s <= -0.5 ? 'bad' : 'mid';
  const L = LINES[tone];
  return pick(rnd() < 0.55 ? L[b.pers] : L.any);
}

function botTalk(g, b) {
  const opts = aliveOf(g).filter(c => c.id !== b.id && !c.immune);
  if (!opts.length) return null;
  const tid = botChooseVote(g, b, opts, false);
  b.intent = tid;
  const t = g.players[tid], n = t.name;
  const worst = worstRevealed(g, t);
  let reasons = [];
  if (worst && worst.score < 0 && worst.cat === 'bio') reasons = [`Возраст: ${worst.item.age} ${plural(worst.item.age, 'год', 'года', 'лет')}. Для бункера тяжеловато.`, 'Возраст тоже имеет значение.'];
  else if (worst && worst.score < 0) reasons = [`„${worst.item.t}“ в бункере — это проблема.`, `У этого игрока „${quote(worst.item.t)}“. Нам это надо?`, `С картой „${quote(worst.item.t)}“ нам будет тяжело.`, `Одно слово: „${quote(worst.item.t)}“.`];
  if (!reasons.length && t.revealed.has('prof') && itemScore(g, 'prof', t.cards.prof) < 1) {
    const base = t.cards.prof.base || t.cards.prof.t, pr = quote(base);
    reasons = [`Профессия „${pr}“ здесь мало что решает.`, `Что нам даст „${pr}“ в такой катастрофе?`, `„${base}“? Сейчас нужны совсем другие люди.`];
  }
  if (!reasons.length && g.round > 1 && hiddenCats(g, t).length >= g.cats.length / 2) reasons = ['Сколько можно прятать карты?', 'Слишком многое держится в секрете.'];
  if (!reasons.length) reasons = ['Пока не вижу, чем это поможет группе.', 'Другие полезнее, это факт.', 'Остальные открыли больше полезного.'];
  g.usedLines = g.usedLines && g.usedLines.round === g.round ? g.usedLines : { round: g.round, set: new Set() };
  const fresh = reasons.filter(r => !g.usedLines.set.has(r));
  const reason = pick(fresh.length ? fresh : reasons);
  g.usedLines.set.add(reason);
  const open = {
    calc: [`Посчитаем трезво: меньше всех группе даст ${n}.`, `Мой голос пойдёт против: ${n}. Это просто расчёт.`, `Я ${b.gender === 'm' ? 'сравнил' : 'сравнила'} карты. Слабее всех ${n}.`, `Без эмоций: ${n}.`],
    hot: [`${n}, ты нам там зачем вообще?`, `${n}, на выход!`, `Всё, я ${b.gender === 'm' ? 'решил' : 'решила'}: ${n}.`, `${n}, даже не начинай оправдываться.`],
    sly: [`Не хочу никого обижать, но ${n}…`, `А что насчёт тебя, ${n}?`, `Интересно, почему все молчат про тебя, ${n}?`, `${n}, ты ведь понимаешь, к чему я веду?`],
    kind: [`Мне правда жаль, ${n}, но, кажется, твоя очередь.`, `${n}, не обижайся, пожалуйста.`, `Я долго ${b.gender === 'm' ? 'думал' : 'думала'}… ${n}, прости.`, `Это тяжело говорить, но ${n}.`]
  }[b.pers];
  const freshOpen = open.filter(o => !g.usedLines.set.has(o));
  const opener = pick(freshOpen.length ? freshOpen : open);
  g.usedLines.set.add(opener);
  let line = `${opener} ${reason}`;
  if (inDanger(g, b) && rnd() < 0.6) line += ' ' + pick(['И нет, я никуда не уйду.', 'А на меня смотреть не надо.']);
  return line;
}

function botMaybeAct(g, b) {
  const a = b.action;
  if (a.used) return;
  const P = PERS[b.pers];
  const last = g.round >= g.rounds;
  const others = aliveOf(g).filter(p => p.id !== b.id);
  if (!others.length) return;
  let want = false, target = null;
  const swapPick = cat => {
    const mine = itemScore(g, cat, b.cards[cat]);
    if (mine >= 0.5) return null;
    const known = others.filter(o => o.revealed.has(cat)).sort((x, y) => itemScore(g, cat, y.cards[cat]) - itemScore(g, cat, x.cards[cat]));
    if (known[0] && itemScore(g, cat, known[0].cards[cat]) > mine) return known[0];
    const unk = others.filter(o => !o.revealed.has(cat));
    return unk.length ? pick(unk) : null;
  };
  switch (a.id) {
    case 'immune': want = inDanger(g, b) || (last && rnd() < 0.7); break;
    case 'double': want = rnd() < P.act || last; break;
    case 'newprof': want = itemScore(g, 'prof', b.cards.prof) < 1.5; break;
    case 'swap': target = swapPick('health'); want = !!target; break;
    case 'swapbag': target = swapPick('bag'); want = !!target; break;
    case 'xray': {
      const c = others.filter(o => hiddenCats(g, o).length).sort((x, y) => hiddenCats(g, y).length - hiddenCats(g, x).length);
      target = c[0] || null;
      want = !!target && (rnd() < P.act || last);
      break;
    }
    case 'search': want = rnd() < P.act * 0.6 || last; break;
    case 'intel': want = rnd() < P.act * 0.7 || last; break;
    case 'stash': want = rnd() < 0.5 || last; break;
    case 'gag': {
      const byGrudge = others.slice().sort((x, y) => ((b.grudge[y.id] || 0) - (b.rel[y.id] || 0)) - ((b.grudge[x.id] || 0) - (b.rel[x.id] || 0)));
      target = byGrudge[0];
      want = rnd() < P.act || last;
      break;
    }
  }
  if (want) applyAction(g, b, target ? target.id : null);
}

function botStandIn(p) { return { ...p, pers: p.pers || 'calc', intent: null }; }
function validReveal(g, p, k, cats) {
  const hid = hiddenCats(g, p);
  const need = Math.min(k, hid.length);
  const set = [...new Set(Array.isArray(cats) ? cats : [])].filter(c => hid.includes(c));
  if (g.round === 1 && hid.includes('prof') && !set.includes('prof')) return null;
  return set.length === need ? set : null;
}

/* ================= КАРТЫ ДЕЙСТВИЙ ================= */
function applyAction(g, p, tid) {
  const a = p.action;
  a.used = true;
  const t = tid != null ? g.players[tid] : null;
  let effect = '';
  switch (a.id) {
    case 'xray': {
      const hid = hiddenCats(g, t);
      if (!hid.length) { effect = `У игрока ${t.name} все карты уже открыты.`; break; }
      const c = pick(hid);
      t.revealed.add(c);
      effect = `Открыто у игрока ${t.name}: ${lc(CATLABEL[c])}, ${quote(t.cards[c].t)}.`;
      break;
    }
    case 'swap':
    case 'swapbag': {
      const c = a.id === 'swap' ? 'health' : 'bag';
      [p.cards[c], t.cards[c]] = [t.cards[c], p.cards[c]];
      renderCard(p.cards[c], p); renderCard(t.cards[c], t);
      p.revealed.add(c); t.revealed.add(c);
      effect = `Обмен с игроком ${t.name}: ${c === 'health' ? 'здоровье' : 'багаж'}. Обе карты открыты.`;
      break;
    }
    case 'immune': p.immune = true; effect = 'В этом раунде голосовать против этого игрока нельзя.'; break;
    case 'double': p.double = true; effect = 'В этом раунде этот голос считается за два.'; break;
    case 'newprof': {
      p.cards.prof = makeProf(g.decks);
      renderCard(p.cards.prof, p);
      p.revealed.add('prof');
      effect = `Новая профессия: ${quote(p.cards.prof.t)}.`;
      break;
    }
    case 'search': aliveOf(g).forEach(x => x.revealed.add('bag')); effect = 'Все открывают багаж.'; break;
    case 'gag': t.muted = true; effect = `${t.name} не голосует в этом раунде.`; break;
    case 'intel': g.twistOpen = true; refreshNeeds(g); effect = `Секретная карта катастрофы: ${g.twist.raw}`; break;
    case 'stash': g.bunker.stash += 12; refreshNeeds(g); effect = 'Нашёлся тайник: еды в бункере теперь больше на год.'; break;
  }
  addLog(g, { kind: 'event', who: p.name, text: `играет «${a.name}». ${effect}` });
  UI.update(g);
}

/* ================= ХОД ИГРЫ ================= */
async function runGame(g) {
  CUR = g;
  try {
    g.phase = 'start';
    UI.table(g);
    addLog(g, { kind: 'sys', text: `${g.cat.name}. Мест в бункере: ${g.capacity}, претендентов: ${g.players.length}.` });
    while (aliveOf(g).length > g.capacity) {
      await playRound(g);
      if (aliveOf(g).length > g.capacity) { await UI.wait(g, 'result', 'Следующий раунд'); check(g); }
    }
    g.players.forEach(p => g.cats.forEach(c => p.revealed.add(c)));
    g.phase = 'end';
    UI.update(g);
    await UI.wait(g, 'end', 'Открыть секретную карту и узнать, что было дальше');
    check(g);
    UI.final(g, computeOutcome(g));
  } catch (e) {
    if (!(e instanceof Abort)) throw e;
  }
}

function drawEvent(g) {
  if (!g.events.length) return;
  const e = g.events.pop();
  g.eventLog.push(e);
  if (e.good) g.extraCover.add(e.need); else g.extraNeeds.add(e.need);
  refreshNeeds(g);
  addLog(g, { kind: 'news', text: e.t, note: e.good ? `Это поможет: ${needName(e.need)}.` : `Важнее стало: ${needName(e.need)}.` });
}

async function playRound(g) {
  g.round++;
  const alive = aliveOf(g);
  alive.forEach(p => { p.immune = false; p.double = false; p.muted = false; p.lastVotes = 0; p.intent = null; });
  g.tally = null;
  const k = revealsThisRound(g);
  g.phase = 'reveal';
  addLog(g, { kind: 'round', text: `Раунд ${g.round} из ${g.rounds}` });
  if (g.round > 1) drawEvent(g);
  addLog(g, { kind: 'sys', text: g.round === 1 ? 'Каждый открывает профессию и ещё одну карту на выбор.' : `Каждый открывает ${k} ${plural(k, 'карту', 'карты', 'карт')} на выбор.` });
  UI.update(g);
  const off = (g.round - 1) % alive.length;
  const order = alive.slice(off).concat(alive.slice(0, off));
  for (const p of order) {
    g.current = p.id;
    UI.update(g);
    if (p.human) {
      if (g.multiHuman) { await UI.pass(g, p, 'открыть свои карты'); check(g); }
      const cats = await humanReveal(g, p, k);
      check(g);
      for (const c of cats) {
        p.revealed.add(c);
        addLog(g, { kind: 'reveal', who: p.name, card: { label: CATLABEL[c], t: p.cards[c].t } });
      }
      UI.update(g);
      await sleep(300); check(g);
    } else {
      await sleep(600); check(g);
      botMaybeAct(g, p);
      const cats = botPickReveal(g, p, Math.min(k, hiddenCats(g, p).length));
      for (const c of cats) {
        p.revealed.add(c);
        addLog(g, { kind: 'bot', who: p.name, card: { label: CATLABEL[c], t: p.cards[c].t }, text: botRevealLine(g, p, c) });
        UI.update(g);
        await sleep(480); check(g);
      }
    }
  }
  g.current = null;
  g.phase = 'talk';
  UI.update(g);
  for (const b of shuffle(aliveOf(g).filter(p => !p.human))) {
    await sleep(750); check(g);
    const line = botTalk(g, b);
    if (line) addLog(g, { kind: 'talk', who: b.name, text: line });
  }
  await UI.wait(g, 'talk', 'К голосованию');
  check(g);
  await voting(g, aliveOf(g), false);
}

async function voting(g, cands, isRevote) {
  g.phase = 'vote';
  UI.update(g);
  const alive = aliveOf(g);
  const votes = [];
  const optsFor = p => cands.filter(c => c.id !== p.id && !c.immune);
  const humans = alive.filter(x => x.human && !x.muted && optsFor(x).length);
  if (g.multiHuman) {
    for (const p of humans) {
      await UI.pass(g, p, 'проголосовать'); check(g);
      const to = await UI.vote(g, p, optsFor(p), isRevote);
      check(g);
      votes.push({ from: p.id, to, w: p.double ? 2 : 1 });
    }
  } else {
    const res = await Promise.all(humans.map(p => humanVote(g, p, optsFor(p), isRevote).then(to => ({ p, to }))));
    check(g);
    for (const { p, to } of res) votes.push({ from: p.id, to, w: p.double ? 2 : 1 });
  }
  for (const b of alive.filter(x => !x.human && !x.muted)) {
    const opts = optsFor(b);
    if (!opts.length) continue;
    votes.push({ from: b.id, to: botChooseVote(g, b, opts, true), w: b.double ? 2 : 1 });
  }
  alive.filter(p => p.muted).forEach(p => addLog(g, { kind: 'sys', text: `${p.name} с кляпом и не голосует.` }));

  const count = new Map(cands.map(c => [c.id, 0]));
  votes.forEach(v => count.set(v.to, (count.get(v.to) || 0) + v.w));
  alive.forEach(p => { p.lastVotes = count.get(p.id) || 0; p.prevVotes = p.lastVotes; });
  g.tally = cands.map(c => ({ id: c.id, n: count.get(c.id) || 0 })).sort((a, b) => b.n - a.n);
  addLog(g, { kind: 'votes', list: votes.map(v => ({ from: g.players[v.from].name, to: g.players[v.to].name, w: v.w })) });
  votes.forEach(v => { const t = g.players[v.to]; t.grudge[v.from] = (t.grudge[v.from] || 0) + 1; });

  const max = Math.max(0, ...g.tally.map(t => t.n));
  let pool;
  if (max === 0) {
    pool = cands.filter(c => !c.immune);
    if (!pool.length) pool = cands.slice();
  } else pool = g.tally.filter(t => t.n === max).map(t => g.players[t.id]);

  if (pool.length > 1 && !isRevote && max > 0) {
    addLog(g, { kind: 'sys', text: `Голоса разделились поровну: ${pool.map(p => p.name).join(', ')}. Переголосование.` });
    g.phase = 'revote';
    UI.update(g);
    await UI.wait(g, 'revote', 'Переголосовать');
    check(g);
    return voting(g, pool, true);
  }
  let outP = pool[0];
  if (pool.length > 1) {
    outP = pick(pool);
    addLog(g, { kind: 'sys', text: max === 0 ? 'Никто не проголосовал. Решает жребий.' : 'Голоса снова разделились. Решает жребий.' });
  }
  eliminate(g, outP);
}

function eliminate(g, p) {
  p.out = true; p.outRound = g.round; p.justOut = true;
  g.cats.forEach(c => p.revealed.add(c));
  g.phase = 'result';
  addLog(g, { kind: 'out', text: `${p.name} остаётся за дверью. Личное дело рассекречено.` });
  UI.update(g);
  p.justOut = false;
}

/* ================= ИТОГ ================= */
function shortSrc(card, c) {
  if (c === 'prof') return lc(card.t);
  return card.t.length > 42 ? lc(CATLABEL[c]) : quote(card.t);
}

function computeOutcome(g) {
  const wasOpen = g.twistOpen;
  g.twistOpen = false;
  refreshNeeds(g);
  const before = { dur: effDur(g), supply: effSupply(g), needs: new Set(g.ni.needs) };
  g.twistOpen = true;
  refreshNeeds(g);
  const D = effDur(g), SUP = effSupply(g);
  const twistNotes = [];
  if (D !== before.dur) twistNotes.push(`Срок под землёй: ${fmtMonths(D)} вместо ${fmtMonths(before.dur)}.`);
  if (SUP !== before.supply) twistNotes.push(`Еды на складе: на ${fmtMonths(SUP)}.`);
  const added = [...g.ni.needs].filter(t => !before.needs.has(t));
  if (added.length) twistNotes.push(`Понадобилось ещё: ${added.map(needName).join(', ')}.`);
  const cov = twistFx(g).filter(f => f.k === 'c').map(f => needName(f.a));
  if (cov.length) twistNotes.push(`Это закрыло: ${cov.join(', ')}.`);

  const S = aliveOf(g);
  const needs = [...new Set([...g.ni.needs, 'psy'])];
  const provCats = g.cats.filter(c => PROVIDER_CATS.includes(c));
  const parts = [];
  let score = 0, max = 0;
  for (const need of needs) {
    const N = NEEDS[need];
    max += 2;
    const prov = [];
    let power = 0;
    for (const p of S) {
      const src = provCats.filter(c => p.cards[c].tags.includes(need));
      if (src.length) {
        prov.push(`${p.name} (${src.map(c => shortSrc(p.cards[c], c)).join(', ')})`);
        power += src.reduce((s, c) => s + (p.cards[c].mul || 1), 0);
      }
    }
    const room = g.bunker.rooms.find(r => r[1] === need);
    if (prov.length) {
      score += Math.min(2.5, 1.2 + power * 0.6);
      parts.push({ title: N.name, tone: 'ok', mark: 'есть', text: `${prov.join(', ')}. ${N.ok}` });
    } else if (g.ni.covered.has(need)) {
      score += 0.8;
      const text = room
        ? `Выручало оборудование бункера: ${lc(room[0])}. Но без человека, который в этом разбирается, всё держалось на честном слове.`
        : need === 'food' && SUP >= D ? 'Специалиста не нашлось, но запасов склада хватило на весь срок.'
          : 'Специалиста не нашлось, но помогло то, что нашлось в бункере.';
      parts.push({ title: N.name, tone: 'mid', mark: 'частично', text });
    } else {
      score -= need === 'psy' ? 1 : 2;
      parts.push({ title: N.name, tone: 'bad', mark: 'нет', text: N.bad });
    }
  }

  max += 1;
  const sick = S.filter(p => p.cards.health.flags.includes('contagious'));
  const heavy = S.filter(p => !p.cards.health.flags.includes('contagious') && p.cards.health.v <= -2);
  const medDep = S.filter(p => g.cats.some(c => (c === 'health' || c === 'flaw') && p.cards[c].flags.includes('med')));
  const medOk = g.ni.covered.has('med') || S.some(p => provCats.some(c => p.cards[c].tags.includes('med')));
  if (sick.length) {
    score -= g.cat.group === 2 ? 4 : 2.5;
    parts.push({ title: 'Здоровье', tone: 'bad', mark: 'угроза', text: `${sick.map(p => `${p.name}: ${quote(p.cards.health.t)}`).join('; ')}. Болезнь пошла по бункеру.` });
  } else if (heavy.length) {
    score -= heavy.length * 0.8;
    parts.push({ title: 'Здоровье', tone: 'mid', mark: 'трудности', text: `${heavy.map(p => `${p.name}: ${quote(p.cards.health.t)}`).join('; ')}. На это уходили силы и лекарства.` });
  } else {
    score += 1;
    parts.push({ title: 'Здоровье', tone: 'ok', mark: 'в порядке', text: 'Серьёзных болезней в группе не было.' });
  }
  if (medDep.length && !medOk) {
    score -= medDep.length;
    parts.push({ title: 'Лекарства', tone: 'bad', mark: 'кончились', text: `${medDep.map(p => p.name).join(', ')}: нужно постоянное лечение, но лекарства быстро закончились, а медика не было.` });
  }

  const claus = S.filter(p => g.cats.some(c => p.cards[c].flags.includes('claus')));
  if (claus.length) {
    score -= 1.5 * claus.length;
    parts.push({ title: 'Нервы', tone: 'bad', mark: 'срыв', text: `${claus.map(p => p.name).join(', ')}: страх замкнутого пространства в бункере. Первые месяцы прошли на грани срыва.` });
  }

  const foes = [], friends = [];
  for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
    const a = S[i], b = S[j], r = (a.rel[b.id] || 0) + (b.rel[a.id] || 0);
    if (r < 0) foes.push(`${a.name} и ${b.name}`);
    if (r > 0) friends.push(`${a.name} и ${b.name}`);
  }
  if (foes.length) { score -= foes.length; parts.push({ title: 'Отношения', tone: 'bad', mark: 'вражда', text: `${foes.join('; ')} так и не смогли ужиться. Старые счёты отравляли жизнь всей группе.` }); }
  if (friends.length) { score += 0.5 * friends.length; parts.push({ title: 'Отношения', tone: 'ok', mark: 'опора', text: `${friends.join('; ')} поддерживали друг друга в самые тяжёлые дни.` }); }

  max += 1;
  const young = S.filter(p => p.cards.bio.age <= 45);
  if (young.some(p => p.gender === 'm') && young.some(p => p.gender === 'f')) { score += 1; parts.push({ title: 'Будущее', tone: 'ok', mark: 'есть', text: 'В группе есть молодые мужчины и женщины: у человечества есть продолжение.' }); }
  else { score -= 1; parts.push({ title: 'Будущее', tone: 'bad', mark: 'под вопросом', text: 'Продолжить род в этой группе не выйдет. Она может стать последней.' }); }

  const ratio = score / max;
  let level, title, text;
  if (ratio >= 0.6) { level = 'win'; title = 'Бункер выстоял'; text = `Через ${fmtMonths(D)} гермодверь открылась, и наружу вышли все.`; }
  else if (ratio >= 0.18) { level = 'mid'; title = 'Выжили, но не все'; text = `До выхода на поверхность через ${fmtMonths(D)} дожили не все. Но те, кто дожил, начали всё заново.`; }
  else { level = 'lose'; title = 'Бункер пал'; text = 'Группа не продержалась и половины срока. Тем, кто откроет эту дверь следующим, придётся начинать с чистого листа.'; }
  return { level, title, text, parts, score, max, twist: { t: g.twist.raw, notes: twistNotes, early: wasOpen } };
}

/* ================= КОМНАТА ПО ССЫЛКЕ ================= */
const PEER_PREFIX = 'bunker-room-';
const PEER_URLS = [
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'
];
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function loadPeer() {
  if (window.Peer) return Promise.resolve();
  return PEER_URLS.reduce((prev, url) => prev.catch(() => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => (window.Peer ? res() : rej());
    s.onerror = rej;
    document.head.appendChild(s);
  })), Promise.reject()).catch(() => { throw new Error('peer-load'); });
}
const makeCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const roomLink = code => `${location.href.split('#')[0]}#room=${code}`;
function cleanName(s) { return String(s || '').replace(/[{}|<>]/g, '').trim().slice(0, 16); }
function uniqueName(name, taken) {
  let n = name, k = 2;
  while (taken.includes(n)) n = `${name} ${k++}`;
  return n;
}
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ничего */ } }

const NET = {
  role: null, peer: null, code: null,
  // хозяин
  conns: new Map(), lobby: null, game: null, asks: new Map(), seq: 0, nextGid: 1, syncTimer: null,
  // гость
  conn: null, me: null, view: null, glog: [], askId: null, pendingAct: null, lobbyInfo: null, gotWelcome: false,

  /* ---------- общее ---------- */
  reset() {
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* ничего */ }
    Object.assign(this, {
      role: null, peer: null, code: null, conns: new Map(), lobby: null, game: null, asks: new Map(),
      conn: null, me: null, view: null, glog: [], glogUid: null, askId: null, pendingAct: null, lobbyInfo: null, gotWelcome: false
    });
  },
  send(conn, msg) { try { if (conn) conn.send(msg); } catch (e) { /* ничего */ } },

  /* ---------- хозяин: комната и лобби ---------- */
  async host(name) {
    await loadPeer();
    return new Promise((resolve, reject) => {
      const tryOpen = attempt => {
        const code = makeCode();
        const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
        peer.on('open', () => {
          this.role = 'host'; this.peer = peer; this.code = code;
          this.lobby = { players: [{ name, human: true, remote: null }], mode: setup.mode, cat: setup.cat };
          peer.on('connection', conn => this.hostConn(conn));
          resolve(code);
        });
        peer.on('error', err => {
          if (err && err.type === 'unavailable-id' && attempt < 4) { peer.destroy(); tryOpen(attempt + 1); }
          else if (!this.peer) reject(err);
          else if (this.role === 'host') console.warn('peer', err);
        });
      };
      tryOpen(0);
    });
  },
  hostConn(conn) {
    conn.on('data', msg => this.hostRx(conn, msg));
    conn.on('close', () => this.hostDrop(conn));
    conn.on('error', () => this.hostDrop(conn));
  },
  hostRx(conn, msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'join') return this.hostJoin(conn, cleanName(msg.name) || 'Гость');
    if (!conn.gid) return;
    const a = this.asks.get(msg.askId);
    if (msg.t === 'leave') return this.hostDrop(conn);
    if (!a || a.p.remote !== conn.gid) return;
    const g = this.game;
    if (msg.t === 'act' && a.kind === 'reveal') {
      const p = a.p, act = p.action;
      const okTarget = act.target !== 'other' || (g.players[msg.target] && !g.players[msg.target].out && msg.target !== p.id);
      if (!act.used && okTarget) applyAction(g, p, act.target === 'other' ? msg.target : null);
      this.sendAsk(a);
    }
    if (msg.t === 'reveal' && a.kind === 'reveal') this.finishAsk(a, validReveal(g, a.p, a.k, msg.cats) || this.botAnswer(a));
    if (msg.t === 'vote' && a.kind === 'vote') this.finishAsk(a, a.opts.some(o => o.id === msg.to) ? msg.to : this.botAnswer(a));
  },
  hostJoin(conn, name) {
    const g = this.game;
    if (g && CUR === g) {
      // игра идёт: вернуть вылетевшего игрока или пустить зрителем
      const back = g.players.find(p => p.wasRemote && !p.remote && p.name === name && !p.out);
      const gid = this.nextGid++;
      conn.gid = gid;
      this.conns.set(gid, { conn, name });
      if (back) {
        back.remote = gid; back.human = true; back.wasRemote = false;
        addLog(g, { kind: 'sys', text: `${back.name} снова в игре.` });
      }
      // в следующей партии этот человек тоже играет
      const nm = back ? back.name : uniqueName(name, this.lobby.players.map(p => p.name));
      if (this.lobby.players.length < 12) this.lobby.players.push({ name: nm, human: true, remote: gid });
      this.send(conn, { t: 'welcome', code: this.code, name: nm, spectator: !back });
      this.send(conn, this.lobbyInfoMsg());
      this.send(conn, { t: 'logall', uid: g.uid, log: g.log });
      this.syncNow(g);
      return;
    }
    if (this.lobby.players.length >= 12) { this.send(conn, { t: 'full' }); setTimeout(() => conn.close(), 300); return; }
    const gid = this.nextGid++;
    conn.gid = gid;
    const nm = uniqueName(name, this.lobby.players.map(p => p.name));
    this.conns.set(gid, { conn, name: nm });
    this.lobby.players.push({ name: nm, human: true, remote: gid });
    this.send(conn, { t: 'welcome', code: this.code, name: nm });
    this.lobbyChanged();
  },
  hostDrop(conn) {
    const gid = conn.gid;
    if (!gid || !this.conns.has(gid)) return;
    this.conns.delete(gid);
    if (this.lobby) this.lobby.players = this.lobby.players.filter(p => p.remote !== gid);
    const g = this.game;
    if (g && CUR === g) {
      const p = g.players.find(x => x.remote === gid);
      if (p) {
        p.remote = null; p.human = false; p.wasRemote = true; p.pers = p.pers || 'calc';
        if (!p.out) addLog(g, { kind: 'sys', text: `${p.name} отключился. Пока его нет, за него играет бот.` });
        for (const a of [...this.asks.values()]) if (a.p === p) this.finishAsk(a, this.botAnswer(a));
        UI.update(g);
      }
    } else this.lobbyChanged();
  },
  kick(gid) {
    const c = this.conns.get(gid);
    if (!c) return;
    this.send(c.conn, { t: 'kicked' });
    setTimeout(() => { try { c.conn.close(); } catch (e) { /* ничего */ } }, 200);
    this.hostDrop(c.conn);
  },
  lobbyInfoMsg() {
    const cat = this.lobby.cat === 'random' ? 'случайная' : (CATASTROPHES.find(c => c.id === this.lobby.cat) || {}).name;
    return {
      t: 'lobby', code: this.code,
      players: this.lobby.players.map(p => ({ name: p.name, kind: p.remote ? 'guest' : p.human ? 'host' : 'bot' })),
      mode: this.lobby.mode, cat
    };
  },
  lobbyChanged() {
    const msg = this.lobbyInfoMsg();
    for (const { conn } of this.conns.values()) this.send(conn, msg);
    if (!this.game && document.getElementById('lobbyHost')) renderHostLobby();
  },
  startGame() {
    const L = this.lobby;
    // убрать гостей, которые уже ушли, и дополнить ботами до 4
    L.players = L.players.filter(p => !p.remote || this.conns.has(p.remote));
    while (L.players.length < 4) L.players.push(nextBotName(L.players));
    const g = newGame({ players: L.players.map(p => ({ ...p })), mode: L.mode, cat: L.cat, net: true });
    this.game = g;
    showBrief(g);
  },
  backToLobby() {
    this.game = null;
    CUR = null;
    closeOverlay();
    for (const { conn } of this.conns.values()) this.send(conn, { t: 'tolobby' });
    renderHostLobby();
    this.lobbyChanged();
  },
  close() {
    for (const { conn } of this.conns.values()) this.send(conn, { t: 'closed' });
    setTimeout(() => this.reset(), 300);
  },

  /* ---------- хозяин: синхронизация ---------- */
  viewFor(g, vid) {
    const open = g.twistOpen;
    return {
      uid: g.uid, mode: g.mode, cats: g.cats, capacity: g.capacity, rounds: g.rounds, round: g.round,
      phase: g.phase, current: g.current, tally: g.tally, viewer: vid, multiHuman: false,
      waitKind: g.waitKind, waitLabel: g.waitLabel, hostName: g.players[0].name,
      remoteWait: [...g.remoteWait.values()].map(a => ({ name: a.p.name, kind: a.kind })),
      cat: { name: g.cat.name, text: g.cat.text, group: g.cat.group, needs: g.cat.needs },
      dur: g.dur, bunker: g.bunker, twistOpen: open, twist: open ? g.twist : { raw: '', flags: [], tags: [] },
      ni: { needs: [...g.ni.needs], covered: [...g.ni.covered] }, eventLog: g.eventLog,
      players: g.players.map(p => ({
        id: p.id, name: p.name, human: p.human, remote: !!p.remote, wasRemote: p.wasRemote, gender: p.gender, pers: p.pers,
        out: p.out, outRound: p.outRound, justOut: p.justOut, immune: p.immune, double: p.double, muted: p.muted, lastVotes: p.lastVotes,
        revealed: [...p.revealed],
        action: (p.id === vid || p.action.used) ? p.action : { used: false, name: '', desc: '', target: 'none' },
        cards: Object.fromEntries(g.cats.map(c => [c, (p.revealed.has(c) || p.id === vid) ? { t: p.cards[c].t } : { t: '' }]))
      }))
    };
  },
  vidOf(gid) { const p = this.game && this.game.players.find(x => x.remote === gid); return p ? p.id : null; },
  syncNow(g) {
    clearTimeout(this.syncTimer);
    if (this.role !== 'host' || this.game !== g || g.finalSent) return;
    for (const [gid, { conn }] of this.conns) this.send(conn, { t: 'state', view: this.viewFor(g, this.vidOf(gid)) });
  },
  hostSync(g) {
    if (this.role !== 'host' || this.game !== g) return;
    clearTimeout(this.syncTimer);
    this.syncTimer = setTimeout(() => this.syncNow(g), 40);
  },
  hostLog(g, e) {
    if (this.role !== 'host' || this.game !== g) return;
    for (const { conn } of this.conns.values()) this.send(conn, { t: 'log', uid: g.uid, e });
  },
  hostFinal(g, out) {
    if (this.role !== 'host' || this.game !== g) return;
    clearTimeout(this.syncTimer);
    g.finalSent = true;
    for (const [gid, { conn }] of this.conns) this.send(conn, { t: 'final', view: this.viewFor(g, this.vidOf(gid)), out });
  },

  /* ---------- хозяин: ходы игроков по сети ---------- */
  ask(g, p, kind, extra) {
    return new Promise(res => {
      const a = { id: ++this.seq, kind, p, res, ...extra };
      this.asks.set(a.id, a);
      g.remoteWait.set(a.id, a);
      UI.update(g);
      this.sendAsk(a);
    });
  },
  askReveal(g, p, k) { return this.ask(g, p, 'reveal', { k }); },
  askVote(g, p, opts, isRevote) { return this.ask(g, p, 'vote', { opts, isRevote }); },
  sendAsk(a) {
    const c = this.conns.get(a.p.remote);
    const g = this.game;
    if (!c) { this.finishAsk(a, this.botAnswer(a)); return; }
    this.send(c.conn, {
      t: 'ask', kind: a.kind, askId: a.id, k: a.k, isRevote: a.isRevote,
      opts: a.opts ? a.opts.map(o => o.id) : null, view: this.viewFor(g, a.p.id)
    });
  },
  botAnswer(a) {
    const g = this.game, b = botStandIn(a.p);
    if (a.kind === 'reveal') return botPickReveal(g, b, Math.min(a.k, hiddenCats(g, a.p).length));
    return botChooseVote(g, b, a.opts, false);
  },
  finishAsk(a, value) {
    if (!this.asks.has(a.id)) return;
    this.asks.delete(a.id);
    const g = this.game;
    g.remoteWait.delete(a.id);
    const c = this.conns.get(a.p.remote);
    if (c) this.send(c.conn, { t: 'askdone', askId: a.id });
    a.res(value);
    UI.update(g);
  },
  fillAll() { for (const a of [...this.asks.values()]) this.finishAsk(a, this.botAnswer(a)); },

  /* ---------- гость ---------- */
  async join(code, name) {
    await loadPeer();
    return new Promise((resolve, reject) => {
      const peer = new Peer(undefined, { debug: 0 });
      this.peer = peer; this.role = 'guest'; this.code = code;
      const timer = setTimeout(() => reject(new Error('timeout')), 15000);
      peer.on('error', err => { clearTimeout(timer); if (!this.gotWelcome) reject(err); else guestLost(); });
      peer.on('open', () => {
        const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
        this.conn = conn;
        conn.on('open', () => this.send(conn, { t: 'join', name }));
        conn.on('data', msg => {
          if (msg && !this.gotWelcome && ['welcome', 'lobby', 'state', 'logall'].includes(msg.t)) { clearTimeout(timer); this.gotWelcome = true; resolve(msg); }
          if (msg && msg.t === 'full') { clearTimeout(timer); reject(new Error('full')); }
          guestRx(msg);
        });
        conn.on('close', () => { if (this.gotWelcome) guestLost(); });
      });
    });
  },
  guestSend(msg) { this.send(this.conn, msg); }
};

/* ---------- гость: восстановление объекта игры из присланного вида ---------- */
function hydrate(v) {
  v.players.forEach(p => { p.revealed = new Set(p.revealed); });
  v.ni = { needs: new Set(v.ni.needs), covered: new Set(v.ni.covered) };
  return v;
}

function guestRx(msg) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t) {
    case 'welcome': NET.me = msg.name; NET.spectator = !!msg.spectator; lsSet('bunker-name', msg.name); break;
    case 'lobby': NET.lobbyInfo = msg; if (!NET.view || NET.view.phase === 'lobby') renderGuestLobby(); break;
    case 'tolobby': NET.view = null; NET.glog = []; closeOverlay(); renderGuestLobby(); break;
    case 'logall': NET.glog = msg.log.slice(); NET.glogUid = msg.uid; guestRefeed(); break;
    case 'log': {
      if (NET.glogUid !== msg.uid) { NET.glog = []; NET.glogUid = msg.uid; }
      NET.glog.push(msg.e);
      const f = $('#feed');
      if (f && f.dataset.uid === msg.uid) appendFeed(msg.e);
      break;
    }
    case 'state':
      if (NET.view && NET.view.phase === 'final' && NET.view.uid === msg.view.uid) break;
      guestState(hydrate(msg.view));
      break;
    case 'ask': guestAsk(msg); break;
    case 'askdone': if (NET.askId === msg.askId) { NET.askId = null; NET.pendingAct = null; closeOverlay(); } break;
    case 'final': NET.askId = null; closeOverlay(); NET.view = hydrate(msg.view); NET.view.phase = 'final'; UI.final(NET.view, msg.out, { guest: true }); break;
    case 'kicked': guestMessage('Хозяин убрал тебя из комнаты.'); NET.reset(); break;
    case 'closed': guestMessage('Хозяин закрыл комнату.'); NET.reset(); break;
    default: break;
  }
}

function guestState(v) {
  NET.view = v;
  if (v.phase === 'brief') { guestBrief(v); return; }
  if (!$('#dossiers') || $('#screen .table').dataset.uid !== v.uid) {
    $('#screen').innerHTML = tableSkeleton(v, true);
    $('#feed').dataset.uid = v.uid;
    $('#leaveBtn').addEventListener('click', guestLeave);
    guestRefeed();
  }
  paintTable(v);
  $('#panel').innerHTML = guestPanel(v);
}
function guestRefeed() {
  const f = $('#feed');
  if (!f || f.dataset.uid !== NET.glogUid) return;
  f.innerHTML = '';
  NET.glog.forEach(appendFeed);
}
function guestPanel(v) {
  if (v.waitKind) return `${waitBody(v, v.waitKind)}<p class="muted">Ждём, когда ${esc(v.hostName)} нажмёт «${esc(v.waitLabel)}».</p>`;
  if (v.remoteWait.length) return `<p class="turn">Ждём: ${v.remoteWait.map(r => esc(r.name)).join(', ')}.</p>`;
  if (v.phase === 'reveal' && v.current != null) return `<p class="turn">Ход: <b>${esc(v.players[v.current].name)}</b>…</p>`;
  if (v.phase === 'talk') return '<p class="turn">Боты высказываются…</p>';
  if (v.phase === 'vote' || v.phase === 'revote') return '<p class="turn">Идёт голосование…</p>';
  return '';
}
function guestAsk(msg) {
  const v = hydrate(msg.view);
  NET.view = v;
  const me = v.players[v.viewer];
  if (NET.askId === msg.askId && NET.pendingAct) {
    const r = NET.pendingAct; NET.pendingAct = null; r({ g: v, p: me });
    return;
  }
  NET.askId = msg.askId;
  if (msg.kind === 'reveal') {
    UI.reveal(v, me, msg.k, {
      act: target => new Promise(res => { NET.pendingAct = res; NET.guestSend({ t: 'act', askId: msg.askId, target }); })
    }).then(cats => { if (NET.askId === msg.askId) { NET.askId = null; NET.guestSend({ t: 'reveal', askId: msg.askId, cats }); } });
  } else {
    const opts = msg.opts.map(id => v.players[id]);
    UI.vote(v, me, opts, msg.isRevote).then(to => { if (NET.askId === msg.askId) { NET.askId = null; NET.guestSend({ t: 'vote', askId: msg.askId, to }); } });
  }
}
function guestLeave() {
  NET.guestSend({ t: 'leave' });
  setTimeout(() => NET.reset(), 200);
  history.replaceState(null, '', location.href.split('#')[0]);
  closeOverlay();
  renderSetup();
}
function guestLost() {
  if (NET.role !== 'guest') return;
  const code = NET.code;
  NET.reset();
  closeOverlay();
  $('#screen').innerHTML = `
    <section class="panel narrow">
      <h2>Связь с комнатой потеряна</h2>
      <p>Возможно, у хозяина закрылась вкладка или пропал интернет. Если комната ещё жива, можно зайти снова: игра вернёт тебя на твоё место.</p>
      <button type="button" class="btn big" id="rejoin">Подключиться снова</button>
    </section>`;
  $('#rejoin').addEventListener('click', () => renderGuestJoin(code));
}
function guestMessage(text) {
  closeOverlay();
  $('#screen').innerHTML = `
    <section class="panel narrow">
      <h2>${esc(text)}</h2>
      <button type="button" class="btn big" id="toMenu">В главное меню</button>
    </section>`;
  $('#toMenu').addEventListener('click', () => { history.replaceState(null, '', location.href.split('#')[0]); renderSetup(); });
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

let setup = null;
function freshSetup() {
  const pool = shuffle(BOT_NAMES);
  return {
    cat: 'random', mode: 'classic',
    players: [{ name: 'Игрок 1', human: true }].concat(pool.slice(0, 5).map(([name, gender]) => ({ name, gender, human: false })))
  };
}
function nextBotName(list = setup.players) {
  const used = new Set(list.map(p => p.name));
  const free = BOT_NAMES.filter(([n]) => !used.has(n));
  const [name, gender] = free.length ? pick(free) : [uniqueName('Бот', [...used]), pick(['m', 'f'])];
  return { name, gender, human: false };
}
function nextHumanName() {
  const used = new Set(setup.players.map(p => p.name));
  let i = 1;
  while (used.has(`Игрок ${i}`)) i++;
  return `Игрок ${i}`;
}

function redactWidth(p, c) {
  let h = 0;
  for (const ch of p.name + c) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return 45 + (h % 45);
}
const persName = p => PERS[p.pers].name[p.gender === 'm' ? 0 : 1];

function dossierHTML(g, p, opt = {}) {
  const self = g.viewer === p.id;
  const cls = ['dossier'];
  if (p.out) cls.push('out');
  if (p.justOut) cls.push('just-out');
  if (g.current === p.id && g.phase === 'reveal') cls.push('current');
  if (opt.stamp === 'pass') cls.push('passed');
  const rows = g.cats.map(c => {
    const open = p.revealed.has(c) || opt.full;
    if (open) return `<div class="row${c === 'prof' ? ' prof' : ''}"><dt>${CATLABEL[c]}</dt><dd>${esc(p.cards[c].t)}</dd></div>`;
    if (self) return `<div class="row secret"><dt>${CATLABEL[c]}</dt><dd>${esc(p.cards[c].t)}<span class="only">видишь только ты</span></dd></div>`;
    return `<div class="row"><dt>${CATLABEL[c]}</dt><dd><span class="redact" style="width:${redactWidth(p, c)}%" aria-label="скрыто"></span></dd></div>`;
  }).join('');
  const badges = [];
  if (!p.out && p.immune) badges.push('Неприкосновенность');
  if (!p.out && p.double) badges.push('Двойной голос');
  if (!p.out && p.muted) badges.push('С кляпом');
  if (g.tally && p.lastVotes > 0 && !opt.full) badges.push(`Против: ${p.lastVotes}`);
  const act = p.action.used
    ? `Сыграно: «${esc(p.action.name)}»`
    : (self || opt.full) ? `На руках: «${esc(p.action.name)}»` : 'Карта действия на руках';
  const who = p.remote ? 'Человек, по сети' : p.human ? 'Человек' : p.wasRemote ? 'Отключился, играет бот' : `Бот, ${persName(p)}`;
  const stamp = p.out ? '<div class="stamp">Отказано</div>' : opt.stamp === 'pass' ? '<div class="stamp ok">Допущен</div>' : '';
  return `<article class="${cls.join(' ')}">
    <div class="tab">Дело № ${String(p.id + 1).padStart(2, '0')}</div>
    <header><h3>${esc(p.name)}</h3><span class="who">${who}</span></header>
    <dl>${rows}</dl>
    <footer><span class="act">${act}</span>${badges.map(b => `<span class="badge">${b}</span>`).join('')}</footer>
    ${stamp}
  </article>`;
}

function briefHTML(g, compact) {
  const needs = [...g.ni.needs].map(needName).join(', ');

    <p><b>Площадь:</b> ${g.bunker.area} м². <b>Еды:</b> на ${fmtMonths(effSupply(g))}.</p>

    <p><b>Состояние:</b></p><ul>${states}</ul>
    ${compact ? events : ''}

}

function startFromSetup() {
  const seen = new Map();
  setup.players.forEach((p, i) => {
    let name = (p.name || '').replace(/[{}|]/g, '').trim() || (p.human ? `Игрок ${i + 1}` : `Бот ${i + 1}`);
    const base = name;
    let k = seen.get(base) || 0;
    while (seen.has(name)) { k++; name = `${base} ${k + 1}`; }
    seen.set(base, k); seen.set(name, 0);
    p.name = name;
  });
  showBrief(newGame(setup));
}
